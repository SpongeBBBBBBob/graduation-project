# if given, will override the device setting in gym. 
env: 
  numEnvs: 4096
  envSpacing: 5
  episodeLength: 300
  isFlagrun: False
  enableDebugVis: False
  
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Random"
  hybridInitProb: 0.5
  numAMPObsSteps: 10

  localRootObs: True # amp disc obs
  localRootObsPolicy: False # policy obs
  rootHeightObs: False # amp disc obs
  rootHeightObsPolicy: False # policy obs
  keyBodies: ["right_hand", "left_hand", "right_foot", "left_foot"]
  contactBodies: ["right_foot", "left_foot"]
  terminationHeight: 0.15
  enableEarlyTermination: True

  enableSelfCollisionDetection: True
  enableTrackInitState: False
  
  skill: "loco_run"   # W2: walk + jog/run mixed under single skill key

  enableTaskObs: True

  # Run task: track instantaneous target velocity (heading + speed)
  speedMin: 0.5
  speedMax: 3.5            # W2: 0.5 (slow walk) ~ 3.5 m/s (sprint)
  targetChangeProb: 0.005   # per-step probability of resampling target

  # power reward
  power_reward: True
  power_coefficient: 0.0005

  eval:
    # override env settings
    ## successThreshold semantics: mean velocity tracking error (m/s) over the
    ## last 98% of the episode must be below this value to count as success.
    successThreshold: 0.3

  asset:
    assetRoot: "tokenhsi/data/assets"
    assetFileName: "mjcf/phys_humanoid_v3.xml"

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
